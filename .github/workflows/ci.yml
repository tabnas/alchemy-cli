# CI caller: the org-standard polyglot workflow for the ts/ and go/
# trees. rust.yml runs the Rust gate (ci/rust/run.sh) separately.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # deps names the tabnas repositories the ts/ and go/ trees build against
  # from source, dependency first: the grammars `run` reads with, then
  # alchemy, then transduce and render, which build on alchemy's shared
  # types. The other grammars the tests of alchemy's programs read are
  # test-only and released: TypeScript installs them from the registry and
  # Go resolves them from go.mod, so cloning and building each from source
  # here, on every OS, would buy nothing. ci/rust/run.sh lists them for the
  # Rust gate, which takes every crate by path. debug is here though nothing
  # in this repository imports it: json's nested test module (go/debugtest)
  # replaces debug with its sibling checkout, the shared go job's workspace
  # takes in every module it finds, and jsonic requires debug, so without
  # the clone the workspace cannot load jsonic's requirements.
  ci:
    uses: tabnas/.github/.github/workflows/polyglot-ci.yml@main
    with:
      deps: "parser debug json jsonic csv alchemy transduce render"

  # The shared workflow runs `go test ./...` with no build tags. `alchemy
  # run` reads its document through transduce's incremental source, which
  # that module builds only under the `tabnas_nodecell` build tag; without
  # it the run tests skip, and so do go/e2e's tests that read a document.
  # This job runs the suite once more with the tag.
  go-nodecell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: alchemy-cli

      # cache: false, as in support's job: setup-go looks for go.mod in
      # $GITHUB_WORKSPACE, non-recursively, and the checkout is one level
      # down, so the cache step would warn on every run.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      # The same siblings the shared go job clones (the deps input above).
      - name: Clone tabnas dependencies
        shell: bash
        run: |
          set -e
          for dep in parser debug json jsonic csv alchemy transduce render; do
            git clone --depth 1 "https://github.com/tabnas/$dep.git" "$dep"
          done

      # Mirrors the shared workflow's go job: a workspace over every module
      # in the tree, so the suite runs against sibling source.
      - name: Set up go workspace
        shell: bash
        run: |
          set -e
          go work init
          for gm in $(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*'); do
            go work use "$(dirname "$gm")"
          done

      - name: Build with the tag
        working-directory: alchemy-cli/go
        run: go build -tags tabnas_nodecell ./...

      - name: Vet and test with the tag
        working-directory: alchemy-cli/go
        run: |
          go vet -tags tabnas_nodecell ./...
          go test -tags tabnas_nodecell -v ./...
