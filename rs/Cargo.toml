[package]
name = "tabnas-alchemy-cli"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "The alchemy command: runs programs in the alchemy streaming language over JSON documents, composing tabnas-alchemy, tabnas-transduce and tabnas-render."
license = "MIT"
homepage = "https://tabnas.dev"
repository = "https://github.com/tabnas/alchemy-cli"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["dsl", "streaming", "transducer", "cli", "tabnas"]
categories = ["command-line-utilities", "parsing"]

# `alchemy canon | format | check | explain | run`, moved here from
# tabnas-alchemy: the one place the language, the routers and the
# renderers meet.
[[bin]]
name = "alchemy"
path = "src/bin/alchemy.rs"

[dependencies]
# Sibling checkouts, the standard tabnas development model: the language
# and its shared types, the routers (and the parser source `run` and
# `translate` read their input through), the renderers, and the twelve
# grammars `translate` reads and writes, each with its translation parts
# (`run` parses its input with the JSON one).
tabnas-alchemy = { path = "../../alchemy/rs" }
tabnas-transduce = { path = "../../transduce/rs" }
tabnas-render = { path = "../../render/rs" }
tabnas-json = { path = "../../json/rs" }
tabnas-csv = { path = "../../csv/rs" }
tabnas-ini = { path = "../../ini/rs" }
tabnas-json5 = { path = "../../json5/rs" }
tabnas-jsonc = { path = "../../jsonc/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
tabnas-jsonl = { path = "../../jsonl/rs" }
tabnas-markdown = { path = "../../markdown/rs" }
tabnas-toml = { path = "../../toml/rs" }
tabnas-xml = { path = "../../xml/rs" }
tabnas-yaml = { path = "../../yaml/rs" }
tabnas-zon = { path = "../../zon/rs" }

[dev-dependencies]
# The failures the binary prints on standard error, read back as JSON.
serde_json = { version = "1.0", features = ["preserve_order"] }
# The tests moved here from tabnas-alchemy, which lower and run programs
# on transduce's routers and render's renderers, reading alchemy's shared
# fixtures from its sibling checkout. Sibling checkouts, like the rest: the
# engine (its `Tabnas` and its error catalogue) and the shared fixture
# loader and runner; the grammars the tests read documents with are the
# command's own dependencies.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
